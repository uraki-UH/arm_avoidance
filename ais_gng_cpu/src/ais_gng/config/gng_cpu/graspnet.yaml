ais_gng_node:
  ros__parameters:
    node.num_max: 5000
    node.learning_num: 5000
    node.unknown_learning_rate: 0.8
    node.eta_s1: 0.08
    node.eta_s2: 0.008
    node.covariance_enabled: true
    # 学習グラフ全体の隣接数に基づく境界候補
    boundary.enable_candidates: true
    # 境界候補の隣接数上限
    boundary.max_neighbors: 4
    # 実測レイと明示視野による追加証拠。観測原点・姿勢・視野不足時は不明
    boundary.enable_evidence: true
    # 局所平面への期待距離と実測距離の誤差余裕[m]
    boundary.min_range_gap_th: 0.03
    # ノードと同一セル内の実測点との対応距離[m]
    boundary.max_anchor_dist: 0.05
    # boundary.lidar_angles_degは未指定でCameraInfo利用。空配列の明示はROS 2で読込不可。
    # LiDAR利用時の指定内容: [開始yaw, 終了yaw, 開始pitch, 終了pitch, yaw間隔, pitch間隔][deg]
    # 第一・第二勝者の入力統計による共分散楕円体
    node.enable_support: false
    # 勝者入力1サンプル当たりの更新率。0は忘却なしの累積統計
    node.support.sample_alpha: 0.01
    # 第二勝者サンプルの重み。第一勝者は1
    node.support.second_weight: 0.5
    # 楕円体の軸標準偏差[m]
    node.support.min_axis_std: 0.002
    # 半軸の標準偏差に対する倍率
    node.support.base_scale: 2.0
    # 古い接続の削除年齢
    edge.age_max: 100
    node.s1_reset_range: 0.1
    node.s1_age_max: [6, 30, 12, 4] # [標準, 安全, 壁面, unknown]
    node.clusted_s1_age: [20, 100, 30, 10] # [標準, 安全, 壁面, unknown]
    node.interval: [0.2, 0.1, 0.1, 0.01] # [標準, 安全, 壁面, unknown]
    node.static.age_min: -1 # 長期記憶の年齢

    ds.transformed: true
    ds.range_max: 0.2
    # 未知・DEFAULT点群の配信点数枠
    ds.all.num_max: 10000
    ds.unknown.num_max: 6000
    ds.human.num_max: 3000

    label.fuzzy.unknown: 0.9
    label.fuzzy.min: 0.5
    label.fuzzy.lpf_time_constant: 0.5

    cluster.num_min: 10
    cluster.velocity.lpf_time_constant: 0.5
    cluster.plane.volume: 10.0
    cluster.unknown.edge_distance_max: 0.2
    cluster.other.edge_distance_max: 0.4
    cluster.human.radius: 0.6
    cluster.human.hysteresis_age: 5
    cluster.human.confirmation_age: 5
    cluster.car.hysteresis_age: 5
    cluster.car.confirmation_age: 5

    classify.human: true
    classify.human.model: "NN_human.pt"
    classify.car: false
    classify.car.model: "NN_car.pt"
    classify.threshold: 0.7

    performance.log_interval_ms: 0

    input.point_cloud_num: 100000
    input.sampling_mode: "uniform"
    input.base_frame_id: "map"
    input.voxel_grid_unit: 0.02
    input.visualize: true
    input.local_coordinates: true
    input.x_min: -10.
    input.x_max: 10.
    input.y_min: -10.
    input.y_max: 10.
    input.z_min: -1.
    input.z_max: 20.
    input.topic_names: ["/camera/camera/depth/color/points"]
