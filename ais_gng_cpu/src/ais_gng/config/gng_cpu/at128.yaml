ais_gng_node:
  ros__parameters:
    plane_clustering: true
    curve_clustering: true #平面クラスタリングfalseでは実行できない
    # 元平面に接続する候補への曲面探索限定。
    surface_model.enable_plane_local_search: true

    # 既存最近傍ノードの非平面所属による重点学習。総学習回数は維持、フレーム保持なし。
    enable_tracking_attention: true
    tracking_attention.mode: nearest_nonplane # coarseは従来の粗いセル集計
    tracking_attention.ratio: 0.5 # 総学習回数からの重点配分
    tracking_attention.timeout_sec: 2.0 # 前回所属の有効期間[s]
    tracking_attention.enable_pointcloud: true # 重点機能ON時の候補点群。購読時のみ展開。

    # 占有あり・ノード未到達・隣接平面で説明不能なセルの直接挿入。起動時設定。
    enable_node_insertion:  true
    node_insertion.max_unobserved_frames: 3 # 平面で説明不能なノードの連続未観測寿命[入力回数]。
    node_insertion.max_plane_dist_th: 0.08 # 隣接平面で説明可能な厚み[m]。
    node_insertion.plane_margin: 0.1 # 有限平面の面内範囲への余白[m]。
    node_insertion.timeout_sec: 0.5 # 前回平面情報の有効期間[s]。

    # 平面所属ノードのセルと6隣接の入力占有セル。購読時のみ生成、所属判定とは独立。
    plane_contact.enable_voxels: true
    plane_contact.interval_sec: 0.5 # 可視化出力の更新間隔[s]。

    node.num_max: 20000
    node.learning_num: 4000
    node.unknown_learning_rate: 0.3
    node.eta_s1: 0.08
    node.eta_s2: 0.008
    node.eta_decay_rate: 1.00
    node.s1_reset_range: 0.1
    node.grid: 1.0
    node.s1_age_max: [6, 6, 6, 3] #[default, safe, wall, unknown]
    node.clusted_s1_age: [20, 20, 6, 6] 
    node.interval: [0.1, 0.4, 0.4, 0.1] 
    node.static.age_min: -1 # 長期記憶の年齢
    node.static.s1_age_max: 100 # 長期記憶ノードの未観測・未選択寿命（GNG更新回数）

    ds.transformed: true
    ds.range_max: 0.2
    ds.all.num_max: 10000
    ds.unknown.num_max: 5000
    ds.human.num_max: 3000

    label.fuzzy.unknown: 0.6
    label.fuzzy.min: 0.5
    label.fuzzy.lpf_time_constant: 0.5

    edge.num_max: 100000
    edge.age_max: 100

    cluster.num_max: 100
    cluster.node_num_min: 10
    cluster.velocity.lpf_time_constant: 0.5
    cluster.plane.volume: 10.0
    cluster.unknown.edge_distance_max: 0.2
    cluster.other.edge_distance_max: 0.4
    cluster.human.radius: 0.6
    cluster.human.hysteresis_age: 5
    cluster.human.confirmation_age: 5
    cluster.car.hysteresis_age: 5
    cluster.car.confirmation_age: 5
    cluster.safe_terrain.merge_distance_max: 0.25
    cluster.safe_terrain.merge_normal_angle_deg: 10.0
    cluster.non_safe.merge_distance_max: 0.0

    classify.human: true
    classify.human.model: "NN_human.pt"
    classify.car: true
    classify.car.model: "NN_car.pt"
    classify.threshold: 0.7
    classify.device: "cpu"

    input.topic_names: ["/scan"]
    input.point_cloud_num: 200000
    input.base_frame_id: "map"
    input.voxel_grid_unit: 0.5
    input.visualize: true
    input.local_coordinates: false
    input.x_min: -200.
    input.x_max: 200.
    input.y_min: -200.
    input.y_max: 200.
    input.z_min: -20.0
    input.z_max: 20.0
