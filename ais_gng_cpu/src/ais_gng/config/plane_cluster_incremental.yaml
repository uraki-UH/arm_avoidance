plane_cluster_incremental_node:
  ros__parameters:
    # 増分方式の平面クラスタ生成。ラベルの出力属性化。
    # 距離しきい値の局所ノード間隔による正規化比。

    # 種候補を平面クラスタとして確定するための最小所属ノード数。
    # 新規領域の種候補扱い。既存クラスタの一時的なノード数不足時は追跡のみ継続。
    min_cluster_nodes: 10

    # 未所属ノード取り込み用の平面までの正規化距離上限。
    # score = |平面法線・(ノード位置 - クラスタ重心)| / 対象ノードの局所エッジ長。
    # 局所エッジ長は隣接距離の中央値（偶数本は小さい側）。長い橋エッジの影響抑制。
    # score による取り込み判定。共分散固有値比との非対応。
    # 最終確定時の厚み上限との同時調整。取り込みだけを緩めた場合の確定時一括棄却。
    growth_residual_ratio: 0.15
    # 既所属ノード保持用の同じ正規化距離上限。
    # 取り込みより緩い上限によるヒステリシス。境界ノードの所属往復の抑制。
    retention_residual_ratio: 0.30

    # 距離比の分母への任意の絶対上限[m]。0は上限なしの局所スケール追従。
    max_effective_spacing: 0.0

    # ノード法線に掛けるEMA(指数移動平均)(alpha=0.3でp99.9が約22度)。
    normal_filter_alpha: 0.30

    # GNGが計算済みのrhoを新規クラスタの種順序に再利用する。
    # 古いbagのrho未設定を考慮し、独立ノードでは既定false。
    # CPU ais_gng直結経路では既定true。
    use_node_rho_for_seed_order: false

    # 種の生成・成長で要求する法線の許容角度[deg]。内積比較cos値へ内部で変換。
    normal_alignment_deg: 30.0

    # 既に所属しているノードの保持・取り込み・移動で要求する法線の許容角度[deg]。
    # 種の判定用より緩くする。
    retention_normal_alignment_deg: 70.0

    # 共分散固有値λに対する面内縦横比 sqrt(λ2 / λ3)。面幅条件との選択判定。
    min_cluster_planarity: 0.45
    # 面内短軸標準偏差 / 平均局所ノード間隔。長い路面と細い鎖の区別用。
    min_plane_width_ratio: 1.0
    # 平面からのRMS距離 / 平均局所ノード間隔。任意の絶対上限付き。
    max_normalized_cluster_residual: 0.15

    # 成長中の面内縦横比 sqrt(λ2 / λ3)。面幅条件との選択判定。
    min_growth_planarity: 0.25

    # ノード取り込み・移動時の候補クラスタへの隣接エッジ数の要求値。
    # ノード1個の判定は偶然の接続で誤って移りやすい。
    connection_requirement: 2

    # 未所属ノード限定の面内接続による取り込み救済。既所属間の移動には非適用。
    # 1本接続の救済は通常要求2本かつ成長距離内。複数接続は保持用距離までの救済。
    # 確認済み平面への接続、他平面への接続なし、全エッジの面内方向が条件。
    enable_coplanar_absorption: true
    # 候補から伸びる全エッジと平面との角度[deg]。面外形状の誤吸収防止用。
    max_absorption_edge_angle_deg_th: 20.0
    # 平面への接続長 / 両端の局所間隔の小さい側。短い接続の確認用。
    max_absorption_edge_ratio_th: 2.5

    # クラスタ併合の候補と認めるための、クラスタ間直接エッジ数の要求値。
    merge_connection_requirement: 2

    # 通常2本接続を要求する設定での、小断片に限定した1本接続の救済。
    enable_fragment_merge: true
    # 小さい側の所属ノード数。
    max_fragment_nodes: 30
    # 接続長 / 両端の局所間隔の小さい側。長い橋エッジの除外用。
    max_fragment_edge_ratio_th: 2.5
    # 各側・接触部・統合後平面の正規化RMS。通常併合より強い適合条件。
    max_fragment_residual_ratio_th: 0.10
    # 同じ永続クラスタ対で幾何条件を満たした連続入力フレーム数。
    min_fragment_merge_frames: 3

    # 新規クラスタ成長中の、追加候補から生成中の種への必要隣接エッジ数。
    # 生成直後に限定した通常時より緩い接続条件。
    birth_neighbor_requirement: 1

    # 所属クラスタ A から候補 B への移動条件: score(B) < score(A) - この値。
    # score: 上記の正規化平面距離。境界での僅差な所属往復の抑制。
    migration_improvement_margin: 0.10

    # 最小クラスタノード数に加える移動元保護余裕。
    # 小さいクラスタの境界からの漸減・消滅の防止。
    donor_protection_buffer: 5

    # 取り込み・移動時の複数接続ノードに対する保持用距離への緩和。
    # 既所属ノードの保持ヒステリシスとは独立。
    enable_multi_edge_dist_relaxation: false

    # 1入力フレームあたりの「解放→取り込み・移動→再平面フィット」最大回数。
    # 所属変化ゼロ時の早期終了。
    maintenance_iter: 2

    # 併合後の面内縦横比 sqrt(λ2/λ3)。面幅条件との選択判定。
    merge_min_planarity: 0.25

    # 併合後厚み比の許容上限: max(倍率 * max(r_A, r_B), 下限)。
    # r = sqrt(λ1) / mean(spacing)。併合による厚み比の過度な悪化の防止。
    merge_residual_growth_ratio: 1.1
    # 上式の下限値。個別クラスタの厚み比が極小の場合の許容値縮小の防止。
    merge_residual_growth_min_th: 0.1
    # 各側全体から統合平面、および接続端点から相手平面へのRMS距離比。
    # 分母は各評価点群の局所間隔平均。小面の法線誤差の遠方外挿と段差吸収の防止。
    max_merge_side_residual_ratio: 0.15

    # 新規平面クラスタの確定後、出力前に必要な確認フレーム数。
    # 0 時の即時出力。
    birth_confirm_frames: 3

    # 分割条件の連続成立を許容するフレーム数。0は即時分割。
    split_confirm_frames: 3
    # 非連結成分の面外接続による分割確認。接続切れだけの場合の所属維持。
    enable_directional_split: true
    # 元平面とエッジとの角度[deg]。面外接続の判定用。
    min_split_edge_angle_deg_th: 30.0
    # 面外接続を持つノード数と、分断候補成分内の同ノード割合。
    min_split_conflict_nodes: 2
    min_split_conflict_ratio_th: 0.25
    # 全エッジ消失時の前回法線・局所間隔による所属判定継続フレーム数。
    max_isolated_frames: 5

    # 最小クラスタノード数不足状態に対する削除前許容フレーム数。
    # ノード単位の逸脱で一時的に縮んだクラスタの回復余地。
    weak_frame_allowance: 5

    # true 時のOBBマーカーへのクラスタID・ノード数文字列の重畳表示。
    enable_text_marker: false

    # 非平面成分のMarkerArray。CPU直結の/nonplane_components利用時はlaunch側で無効化。
    surface_marker_topic: /nonplane_components/markers
    # Marker表示の構成ノード数。非平面成分データの保持とは独立。
    surface_component.min_nodes: 2

ais_gng_node:
  ros__parameters:
    # CPU直結の平面クラスタ計算。計算負荷抑制のため既定無効。
    plane_cluster.direct_enabled: false

    # 単独nodeを含む全平面クラスタ未所属nodeへの連結成分ID付与。
    nonplane_component.direct_enabled: true

    # 非平面成分のnode所属情報topic。
    nonplane_component.output_topic: /nonplane_components
