<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>gng_wasm_core Test</title>
<style>
body{font-family:monospace;background:#1a1a2e;color:#e0e0e0;padding:20px}
pre{background:#16213e;padding:12px;border-radius:6px;overflow-x:auto}
.ok{color:#4ade80} .ng{color:#f87171} .info{color:#60a5fa}
button{background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;margin:4px}
button:hover{background:#2563eb}
canvas{border:1px solid #334155;margin-top:12px;border-radius:4px}
</style>
</head>
<body>
<h2>gng_wasm_core WASM Test</h2>
<div>
  <button onclick="runTest()">Run GNG Test</button>
  <button onclick="runTestWithLabels()">Run with Labels</button>
  <button onclick="runSetParameter()">Test set_parameter</button>
</div>
<pre id="log"></pre>
<canvas id="view" width="600" height="400"></canvas>

<script type="module">
import createModule from '../dist/gng_wasm_core.js';

let Module = null;

function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

async function init() {
  try {
    Module = await createModule();
    log('WASM module loaded successfully.', 'ok');
    log(`Available exports: ${Object.keys(Module).filter(k=>k.startsWith('_gng')).join(', ')}`, 'info');
  } catch(e) {
    log(`Failed to load WASM: ${e.message}`, 'ng');
  }
}

function generateMugPoints(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = 0.04 + Math.random() * 0.005;
    const h = Math.random() * 0.12;
    pts.push(r * Math.cos(t), r * Math.sin(t), h);
  }
  return new Float32Array(pts);
}

function runGng(points, pointCount, config, paramOverrides) {
  const M = Module;
  M.ccall('gng_wasm_reset', null, [], []);

  if (config) {
    const buf = new ArrayBuffer(28);
    const dv = new DataView(buf);
    dv.setUint32(0, config.maxNodes || 200, true);
    dv.setUint32(4, config.iterations || 5000, true);
    dv.setUint32(8, config.lambda || 70, true);
    dv.setUint32(12, config.maxAge || 80, true);
    dv.setFloat32(16, config.eb || 0.05, true);
    dv.setFloat32(20, config.en || 0.006, true);
    dv.setUint32(24, config.seed || 42, true);
    const cfgBytes = new Uint8Array(buf);
    const save = M._malloc ? null : M.stackSave();
    // Use ccall with array type
    M.ccall('gng_wasm_set_config', null, ['array'], [cfgBytes]);
  }

  if (paramOverrides) {
    for (const [name, index, value] of paramOverrides) {
      const nameLen = M.lengthBytesUTF8(name) + 1;
      const namePtr = M._malloc(nameLen);
      M.stringToUTF8(name, namePtr, nameLen);
      const ok = M.ccall('gng_wasm_set_parameter', 'number', ['number','number','number'], [namePtr, index, value]);
      M._free(namePtr);
      log(`  set_parameter("${name}", ${index}, ${value}) = ${ok ? 'ok' : 'FAIL'}`, ok ? 'info' : 'ng');
    }
  }

  // Set points
  const pointsBytes = new Uint8Array(points.buffer);
  M.ccall('gng_wasm_set_points', null, ['array', 'number'], [pointsBytes, pointCount]);

  // Run
  const ok = M.ccall('gng_wasm_run', 'number', [], []);
  return ok;
}

function readResults() {
  const M = Module;
  const nodeCount = M.ccall('gng_wasm_node_count', 'number', [], []);
  const edgeCount = M.ccall('gng_wasm_edge_count', 'number', [], []);
  const clusterCount = M.ccall('gng_wasm_cluster_count', 'number', [], []);
  const iter = M.ccall('gng_wasm_iteration', 'number', [], []);

  const jsonSize = M.ccall('gng_wasm_get_graph_json_size', 'number', [], []);
  const ptr = M._malloc(jsonSize);
  M.ccall('gng_wasm_write_graph_json', 'number', ['number','number'], [ptr, jsonSize]);
  const jsonStr = M.UTF8ToString(ptr);
  M._free(ptr);

  return { nodeCount, edgeCount, clusterCount, iter, json: JSON.parse(jsonStr) };
}

function drawResult(result) {
  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const nodes = result.json.nodes || [];
  const edges = result.json.edges || [];
  const clusters = result.json.clusters || [];

  const cx = canvas.width / 2, cy = canvas.height / 2, scale = 2500;
  const proj = (n) => ({ x: cx + n.x * scale, y: cy - n.z * scale + 100 });

  const labelColors = ['#9ca3af','#4ade80','#f87171','#facc15','#a78bfa','#38bdf8'];

  // edges
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 1;
  for (const e of edges) {
    if (!nodes[e.a] || !nodes[e.b]) continue;
    const a = proj(nodes[e.a]), b = proj(nodes[e.b]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // nodes
  for (const n of nodes) {
    const p = proj(n);
    ctx.fillStyle = labelColors[n.label || 0] || '#9ca3af';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // cluster labels
  ctx.font = '10px monospace';
  for (const c of clusters) {
    const p = { x: cx + c.x * scale, y: cy - c.z * scale + 100 };
    ctx.fillStyle = labelColors[c.label || 0] || '#9ca3af';
    ctx.fillText(`C${c.id}(${c.node_count}n)`, p.x + 5, p.y - 5);
  }
}

window.runTest = function() {
  clearLog();
  if (!Module) { log('WASM not loaded yet.', 'ng'); return; }

  log('=== Basic GNG Test ===', 'info');
  const pts = generateMugPoints(2000);
  log(`Input: ${pts.length / 3} points`);

  const t0 = performance.now();
  const ok = runGng(pts, pts.length / 3, { maxNodes: 200, iterations: 5000, lambda: 70, seed: 42 });
  const dt = (performance.now() - t0).toFixed(1);

  if (!ok) { log('gng_wasm_run returned FAIL', 'ng'); return; }

  const r = readResults();
  log(`Result: nodes=${r.nodeCount}, edges=${r.edgeCount}, clusters=${r.clusterCount}, iter=${r.iter}, time=${dt}ms`, 'ok');
  log(`JSON sample: ${JSON.stringify(r.json.nodes.slice(0, 2))}...`, 'info');

  drawResult(r);
  log('=== PASS ===', 'ok');
};

window.runTestWithLabels = function() {
  clearLog();
  if (!Module) { log('WASM not loaded yet.', 'ng'); return; }

  log('=== Label-aware GNG Test ===', 'info');
  const pts = generateMugPoints(2000);
  log(`Input: ${pts.length / 3} points`);

  const ok = runGng(pts, pts.length / 3, { maxNodes: 200, iterations: 5000, lambda: 70, seed: 42 });
  if (!ok) { log('gng_wasm_run returned FAIL', 'ng'); return; }

  const r = readResults();
  const labels = r.json.nodes.map(n => n.label);
  const fuzzy = r.json.nodes.filter(n => n.fuzzy && n.fuzzy.some(v => v > 0));
  log(`Nodes: ${r.nodeCount}, with fuzzy data: ${fuzzy.length}`, 'ok');
  log(`Clusters: ${r.clusterCount}`, 'ok');
  if (r.json.clusters.length > 0) {
    log(`Cluster details: ${JSON.stringify(r.json.clusters.map(c => ({id:c.id, label:c.label, nodes:c.node_count})))}`, 'info');
  }
  log(`Normals present: ${r.json.nodes.filter(n=>n.nx!==0||n.ny!==0||n.nz!==0).length}/${r.nodeCount}`, 'info');

  drawResult(r);
  log('=== PASS ===', 'ok');
};

window.runSetParameter = function() {
  clearLog();
  if (!Module) { log('WASM not loaded yet.', 'ng'); return; }

  log('=== set_parameter API Test ===', 'info');
  const pts = generateMugPoints(1500);

  const params = [
    ['node.num_max', 0, 300],
    ['node.eta_s1', 0, 0.08],
    ['node.eta_s2', 0, 0.008],
    ['edge.age_max', 0, 100],
    ['node.s1_age', 0, 6], ['node.s1_age', 1, 6], ['node.s1_age', 2, 6], ['node.s1_age', 3, 3],
    ['node.interval', 0, 0.4], ['node.interval', 1, 0.2], ['node.interval', 2, 0.2], ['node.interval', 3, 0.025],
    ['label.fuzzy.unknown', 0, 0.6],
    ['label.fuzzy.min', 0, 0.5],
    ['cluster.num_min', 0, 10],
    ['cluster.unknown.edge_distance_max', 0, 0.1],
    ['cluster.other.edge_distance_max', 0, 0.4],
  ];

  const ok = runGng(pts, pts.length / 3,
    { maxNodes: 300, iterations: 4000, lambda: 70, seed: 7 },
    params
  );

  if (!ok) { log('gng_wasm_run returned FAIL', 'ng'); return; }

  const r = readResults();
  log(`Result: nodes=${r.nodeCount}, edges=${r.edgeCount}, clusters=${r.clusterCount}`, 'ok');
  drawResult(r);
  log('=== PASS ===', 'ok');
};

init();
</script>
</body>
</html>
