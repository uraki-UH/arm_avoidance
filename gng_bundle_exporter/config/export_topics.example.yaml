topics:
  - alias: graph
    topic: /topological_map
    kind: topological_map
    role: graph
    required: true

  - alias: candidate_graph
    topic: /ToPoDualArm/cand_topological_map
    kind: topological_map
    role: candidate_graph
    compact: true
    sample_every: 1

  - alias: pointcloud
    topic: /topo_points
    kind: pointcloud2
    role: pointcloud
    sample_every: 1

  - alias: metrics
    topic: /grasp_candidate_metrics
    kind: generic
    role: metrics

  - alias: evaluation_metrics
    topic: /evaluation_metrics
    kind: generic
    role: evaluation_metrics
