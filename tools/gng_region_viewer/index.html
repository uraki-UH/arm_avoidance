<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>姿勢領域と占有ボクセル</title>
<style>
:root{color-scheme:light;font:16px system-ui,sans-serif;color:#193044;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:20px}h1{font-size:23px;margin:0}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}header span{font-size:13px;color:#64798a}button,select,input{font:inherit}button,select{border:1px solid #c8d5df;border-radius:7px;padding:7px 11px;color:inherit;background:#fff}button{cursor:pointer}button.load{background:#2465b8;color:#fff;border:0}button.play{background:#187455;color:#fff;border:0}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #62a6e6;outline-offset:2px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:13px;background:#fff;border:1px solid #dbe4ec;border-radius:10px}.toolbar label{display:flex;gap:6px;align-items:center}#status{font-size:14px;min-height:25px;padding:10px 0;overflow-wrap:anywhere}#status[data-is_error=true]{color:#ab2e2e}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.card{background:white;border:1px solid #dbe4ec;border-radius:10px;padding:14px}#viewport{height:620px;position:relative;background:#fafcfe;border-radius:8px;overflow:hidden}#viewport canvas{width:100%;height:100%;display:block;touch-action:none}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin:12px 0 3px}.legend span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;background:var(--color)}h2{font-size:17px;margin:0 0 12px}.properties{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px;margin:0 0 16px}.properties dd{margin:0;font-variant-numeric:tabular-nums}.properties dt{color:#5a7285}.axes{display:flex;gap:9px;align-items:center;font-size:13px}.axes select{max-width:115px;padding:5px}#joint_canvas{width:100%;height:210px;margin:8px 0;background:#fafcfe;border-radius:7px}.muted{font-size:12px;color:#647b8c}.pose_controls{display:flex;gap:8px;align-items:center;margin-top:15px}#pose{min-width:85px;flex:1}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}td,th{padding:7px 4px;text-align:right;border-bottom:1px solid #e6edf2;font-variant-numeric:tabular-nums}td:first-child,th:first-child{text-align:left}details{font-size:13px;color:#5e7485;margin-top:14px}summary{cursor:pointer}pre{font-size:11px;max-height:180px;overflow:auto;background:#f6f8fb;padding:9px}details p{line-height:1.6}#node{min-width:90px}#neighbor{max-width:160px}[hidden]{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}#viewport{height:460px}.card{min-width:0}}@media(max-width:520px){main{padding:10px}.toolbar{gap:10px;font-size:14px}#viewport{height:380px}}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script>
</head>
<body>
<main>
<header><h1>姿勢領域と占有ボクセル</h1><span id="model_label">保存索引 · 読取り専用</span></header>
<section class="toolbar" aria-label="表示設定">
<button id="load" class="load">JSON読込み</button><input id="file" type="file" accept=".json,application/json" hidden>
<label><span id="node_label">ノード</span> <select id="node" aria-label="領域ノード" disabled></select></label>
<button id="previous" aria-label="前のノード" disabled>←</button><button id="next" aria-label="次のノード" disabled>→</button>
<label>比較 <select id="neighbor" aria-label="比較ノード" disabled><option value="">なし</option></select></label>
<label>ボクセル <select id="layer"><option value="occupied">占有包絡</option><option value="exclusive">他領域にない占有</option><option value="outer">照会用・余裕込み</option><option value="core">基準姿勢の占有</option><option value="inner">全姿勢共通の内側</option></select></label>
<label><input id="enable_pose" type="checkbox" checked>姿勢例（球近似）</label>
<button id="fit">全体表示</button>
</section>
<div id="status" role="status" aria-live="polite">保存索引の読込み中</div>
<div class="layout">
<section class="card">
<div id="viewport" aria-label="領域占有ボクセルの3D表示"></div>
<div class="legend"><span style="--color:#e79732">選択側だけ</span><span style="--color:#aab7c3">共通</span><span style="--color:#209a94">比較側だけ</span></div>
<p class="muted">ドラッグ: 回転 · ホイール／ピンチ: 拡大 · 右ドラッグ: 移動</p>
</section>
<aside class="card">
<h2 id="selection_title">ノード未選択</h2>
<dl id="metrics" class="properties"></dl>
<div class="axes"><label>横軸 <select id="axis_x" aria-label="関節投影の横軸"></select></label><label>縦軸 <select id="axis_y" aria-label="関節投影の縦軸"></select></label></div>
<canvas id="joint_canvas" aria-label="関節角度領域の2軸投影"></canvas>
<div id="projection_note" class="muted">他関節を固定しない投影</div>
<div class="pose_controls"><button id="play" class="play" disabled>姿勢例を再生</button><select id="pose" aria-label="領域内の姿勢例" disabled></select></div>
<table aria-label="関節角度の周辺範囲"><thead><tr><th>関節</th><th>最小</th><th>現在例</th><th>最大</th></tr></thead><tbody id="joint_values"></tbody></table>
<details><summary>連動制約</summary><div id="constraint_label"></div><pre id="constraint_values"></pre></details>
<details><summary>表示の範囲</summary><p>占有包絡は保存済みの全関節領域。姿勢例は有限個の例であり、全姿勢の列挙ではありません。関節表の各範囲を独立に組み合わせても領域内とは限りません。</p><p>セル間の隙間は表示用、体積は元の格子幅で集計。球近似・静的モデルの検証表示であり、実機指令・衝突許可・安全保証はありません。内側セル0と索引未登録は別表示です。</p></details>
</aside>
</div>
</main>
<script type="module" src="/viewer.js"></script>
</body>
</html>
