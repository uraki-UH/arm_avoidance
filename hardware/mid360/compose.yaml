services:
  mid360:
    build: .
    image: mid360:local
    network_mode: host
    ipc: host
    init: true
    stop_grace_period: 15s
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      MID360_CONFIG: /config/mid360.yaml
    volumes:
      - ./mid360.yaml:/config/mid360.yaml:ro
