services:
  gng_cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: gng_cpu:latest
    privileged: true
    container_name: gng_cpu_container_uraki    
    tty: true                 # 対話的なプロンプトを維持
    stdin_open: true          # 標準入力を開いたままにする
    ipc: host # ホストのIPC名前空間を使用
    environment:
      - HOME=/root
      - ROS_LOG_DIR=/tmp/roslog
      - GAZEBO_HOME=/root/.gazebo
      - DISPLAY=${DISPLAY}             # ホストのディスプレイ番号をコンテナに渡す
      - QT_X11_NO_MITSHM=1           # Qtアプリケーションでのエラーを回避
      - XDG_RUNTIME_DIR=/tmp/runtime/  # Wayland互換性のための設定
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0} # ROS_DOMAIN_IDを環境変数から取得、なければ0を使用
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11ソケットの共有
      - ${HOME}/.Xauthority:/root/.Xauthority:ro # X認証情報（ホストでxhostを実行済みの場合）
      - .:/ros2_ws/src
      - build_ros2_ws:/ros2_ws/build
      - install_ros2_ws:/ros2_ws/install
      - ros_ws_volume:/ros2_ws/install
      - ros_ws_build_volume:/ros2_ws/build
      - ~/rosbag:/rosbag
      - ~/datasets:/datasets
    devices:
      - "/dev/usb/bus/:/dev/usb/bus/"
    working_dir: /ros2_ws/src/ais_gng
    ports:
      - "9001:9001"
      - "8000:8000"
    #command: "sh /ros2_ws/src/ais_gng/release.sh"

    #npm run devをdockerで実行する用
  frontend:
    image: gng_cpu:latest
    profiles:
      - manual
    depends_on:
      - gng_cpu
    tty: true
    stdin_open: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - .:/ros2_ws/src
      - topofuzzy_frontend_node_modules:/ros2_ws/src/ToPoFuzzy-Viewer/frontend/node_modules
    working_dir: /ros2_ws/src/ToPoFuzzy-Viewer/frontend
    command: >
      bash -lc "
      npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "5173:5173"

  rosbridge:
    image: gng_cpu:latest
    container_name: rosbridge_container_uraki
    depends_on:
      - gng_cpu
    tty: false
    stdin_open: false
    volumes:
      - .:/ros2_ws/src
    environment:
      - HOME=/root
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    ports:
      - "9090:9090"
    command: >
      bash -lc "source /opt/ros/humble/setup.bash && ros2 run rosbridge_server rosbridge_websocket --port 9090"

  
volumes:
  ros_ws_volume:
  ros_ws_build_volume:
  topofuzzy_frontend_node_modules:
