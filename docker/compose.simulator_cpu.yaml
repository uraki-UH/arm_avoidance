# Ubuntu向けのCPU計算環境。ブラウザ描画はホスト側の通常ブラウザ
name: topo-dual-arm-cpu
# build・check・simulate共通の構成。操作名ではなく機能設定による対象選択。
x-cpu-workflow:
  # GNG・VLUT・Viewerの追加構築と、学習済みデータの配置確認。
  enable_gng: false
  model: long
  params_file: gng_vlut_system/config/topo_dual_arm_max_long.yaml
  build:
    build_type: Release
    executor: sequential
    # ROS探索範囲はworkspace.yamlの部品定義からの解決。
    components: [interfaces, perception, shared, planning, viewer]
    base_packages: [ais_gng_feature_msgs, ais_gng_msgs, gng_control_msgs, voxel_msgs]
    gng_packages: [gng_vlut_system, topo_fuzzy_viewer]
  check:
    duration_sec: 1.0
  # 学習データ・実センサ不要の最小回避。方式・物理条件はシナリオ側への集約
  demo:
    scenario_file: benchmarks/cpu_demo/chase.json
services:
  simulator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: simulator_cpu
    image: topo-dual-arm-cpu:humble
    init: true
    network_mode: host
    ipc: host
    stop_grace_period: 30s
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOG_DIR: /tmp/roslog
      CMAKE_BUILD_PARALLEL_LEVEL: ${CMAKE_BUILD_PARALLEL_LEVEL:-1}
      FASTRTPS_DEFAULT_PROFILES_FILE: /ros2_ws/src/docker/fastdds_shm_large_pointcloud.xml
    volumes:
      - ..:/ros2_ws/src
      - cpu_build:/ros2_ws/build
      - cpu_install:/ros2_ws/install
    working_dir: /ros2_ws/src/ToPoDualArmMax_SourceDelivery_20260928/ToPoDualArmMax-Simulator
    command: ["bash", "start_ros.sh"]
volumes:
  cpu_build:
  cpu_install:
