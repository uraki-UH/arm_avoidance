# 既存Humbleコンテナを変更しない、headless専用の起動受付。
name: gng-harmonic-launcher
services:
  launcher:
    image: "${GNG_HARMONIC_IMAGE:-uraki-gazebo-harmonic:local}"
    user: "${GNG_LAUNCHER_UID:-1000}:${GNG_LAUNCHER_GID:-1000}"
    init: true
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp/harmonic_home
      ROS_LOG_DIR: /tmp/harmonic_logs
      FASTRTPS_DEFAULT_PROFILES_FILE: /run/fastdds_udp.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /run/fastdds_udp.xml
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../artifacts/harmonic_launcher:/run/gng-harmonic
      - ../gng_vlut_system/config:/workspace/gng_vlut_system/config:ro
      - ../urdf:/workspace/urdf:ro
      - ./fastdds_harmonic_udp.xml:/run/fastdds_udp.xml:ro
    command:
      - python3
      - /opt/gng_harmonic/gng_vlut_system/lib/gng_vlut_system/harmonic_launcher.py
      - serve
      - --socket
      - /run/gng-harmonic/launcher.sock
