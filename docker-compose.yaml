services:
  gng_cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: gng_cpu:latest
    privileged: true
    container_name: gng_cpu_container
    tty: true
    stdin_open: true
    ipc: host
    network_mode: host

    environment:
      - HOME=/root
      - ROS_LOG_DIR=/tmp/roslog
      - GAZEBO_HOME=/root/.gazebo
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime/
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Wayland/GDM sessions keep the live X11 cookie outside ~/.Xauthority.
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      - /dev:/dev
      - .:/ros2_ws/src
      - build_ros2_ws:/ros2_ws/build
      - install_ros2_ws:/ros2_ws/install
      - ros_ws_volume:/ros2_ws/install
      - ros_ws_build_volume:/ros2_ws/build
      - ${HOME}/rosbag:/rosbag
      - ${HOME}/datasets:/datasets
      # 実機ドライバの計算用コンテナからの除外
      - compute_topoarm_hardware_mask:/ros2_ws/src/ToPoDualArm/topoarm_hardware

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 189:* rmw"

    working_dir: /ros2_ws/src

    # network_mode: host を使うので ports は不要
    # command: "sh /ros2_ws/src/ais_gng/release.sh"

  # RGB-D・LiDARデータセット専用のROS 2ノード実行環境
  dataset_player:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataset_player
    image: dataset_player:latest
    container_name: dataset_pointcloud_player
    profiles:
      - dataset
    tty: true
    stdin_open: true
    ipc: host
    network_mode: host

    environment:
      - HOME=/root
      - ROS_LOG_DIR=/tmp/roslog
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      - .:/ros2_ws/src
      - dataset_player_build:/ros2_ws/build
      - dataset_player_install:/ros2_ws/install
      - ${HOME}/datasets:/datasets

    working_dir: /ros2_ws/src

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      cd /ros2_ws &&
      colcon build --packages-select dataset_pointcloud_player --symlink-install &&
      exec sleep infinity
      "

  # ToPoArm実機ドライバ専用のROS 2 Control実行環境
  topoarm_hardware:
    build:
      context: .
      dockerfile: docker/Dockerfile.topoarm_hardware
    image: topoarm_hardware:latest
    container_name: topoarm_hardware_container
    profiles:
      - hardware
    privileged: true
    tty: true
    stdin_open: true
    ipc: host
    network_mode: host

    environment:
      - HOME=/root
      - ROS_LOG_DIR=/tmp/roslog
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      - /dev:/dev
      - .:/ros2_ws/src
      - topoarm_hardware_build:/ros2_ws/build
      - topoarm_hardware_install:/ros2_ws/install

    working_dir: /ros2_ws/src

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      cd /ros2_ws &&
      colcon build --packages-select topoarm_msgs topoarm_hardware --symlink-install &&
      exec sleep infinity
      "

  # npm run devをdockerで実行する用
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: topofuzzy_frontend:latest
    container_name: frontend
    profiles:
      - manual
    tty: true
    stdin_open: true
    network_mode: host

    environment:
      - HOME=/root
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - .:/ros2_ws/src
      - topofuzzy_frontend_node_modules:/ros2_ws/src/ToPoFuzzy-Viewer/frontend/node_modules

    working_dir: /ros2_ws/src/ToPoFuzzy-Viewer/frontend

    command: >
      bash -c "
      npm run dev -- --host 0.0.0.0 --port 5173
      "

  rosbridge:
    image: gng_cpu:latest
    container_name: rosbridge_container
    depends_on:
      - gng_cpu
    tty: false
    stdin_open: false
    ipc: host
    network_mode: host

    volumes:
      - .:/ros2_ws/src
      - ros_ws_build_volume:/ros2_ws/build
      - ros_ws_volume:/ros2_ws/install

    environment:
      - HOME=/root
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      if [ -f /ros2_ws/install/setup.bash ]; then source /ros2_ws/install/setup.bash; fi &&
      ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090
      "

volumes:
  ros_ws_volume:
  ros_ws_build_volume:
  topofuzzy_frontend_node_modules:
  build_ros2_ws:
  install_ros2_ws:
  compute_topoarm_hardware_mask:
  dataset_player_build:
  dataset_player_install:
  topoarm_hardware_build:
  topoarm_hardware_install:
