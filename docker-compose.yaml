services:
  gng_cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: gng_cpu:latest
    privileged: true
    container_name: gng_cpu_container_uraki
    tty: true
    stdin_open: true
    ipc: host
    network_mode: host

    environment:
      - HOME=/root
      - ROS_LOG_DIR=/tmp/roslog
      - GAZEBO_HOME=/root/.gazebo
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime/

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /dev:/dev
      - .:/ros2_ws/src
      - build_ros2_ws:/ros2_ws/build
      - install_ros2_ws:/ros2_ws/install
      - ros_ws_volume:/ros2_ws/install
      - ros_ws_build_volume:/ros2_ws/build
      - ${HOME}/rosbag:/rosbag
      - ${HOME}/datasets:/datasets

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 189:* rmw"

    working_dir: /ros2_ws/src/ais_gng

    # network_mode: host を使うので ports は不要
    # command: "sh /ros2_ws/src/ais_gng/release.sh"

  # npm run devをdockerで実行する用
  frontend:
    image: gng_cpu:latest
    profiles:
      - manual
    depends_on:
      - gng_cpu
    tty: true
    stdin_open: true
    network_mode: host

    environment:
      - HOME=/root
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - .:/ros2_ws/src
      - topofuzzy_frontend_node_modules:/ros2_ws/src/ToPoFuzzy-Viewer/frontend/node_modules

    working_dir: /ros2_ws/src/ToPoFuzzy-Viewer/frontend

    command: >
      bash -lc "
      npm run dev -- --host 0.0.0.0 --port 5173
      "

  rosbridge:
    image: gng_cpu:latest
    container_name: rosbridge_container_uraki
    depends_on:
      - gng_cpu
    tty: false
    stdin_open: false
    ipc: host
    network_mode: host

    volumes:
      - .:/ros2_ws/src

    environment:
      - HOME=/root

    command: >
      bash -lc "source /opt/ros/humble/setup.bash && ros2 run rosbridge_server rosbridge_websocket --port 9090"

volumes:
  ros_ws_volume:
  ros_ws_build_volume:
  topofuzzy_frontend_node_modules:
  build_ros2_ws:
  install_ros2_ws: