/**:
  ros__parameters:
    # --- Global & System-wide Settings ---
    voxel_idx_shift:
      x_shift: 42
      y_shift: 21
      z_shift: 0
      offset: 1000000

    robot_name: "topoarm"
    urdf_path: "package://gng_vlut_system/urdf/topoarm_description/urdf/topoarm.urdf.xacro"
    resource_root_dir: "/ros2_ws/src/gng_vlut_system/urdf/topoarm_description"
    mesh_root_dir: "/ros2_ws/src/gng_vlut_system/urdf/topoarm_description/meshes"

    # --- GNG & Safety Settings ---
    gng:
      experiment_id: "topoarm"
      data_directory: "gng_results"
      gng_model_filename: "gng.bin"
      vlut_filename: "vlut.bin"
      ground_z_threshold: 0.0
      gng_dimension: 6
      spatial_map_resolution: 0.02
      self_recognition_resolution: 0.02
      arm_cache_resolution: 0.008
      danger_threshold: 0.025
      vlut_resolution: 0.02
      sensing_resolution: 0.02
      vlut_only: false
      use_voxel_collision: true

    # --- Robot Settings ---
    arm_leaf_link_names: "link7"
    voxel_size: 0.02

    # Legacy top-level keys for older launch files/tools.
    experiment_id: "topoarm"
    data_directory: "gng_results"
    gng_model_filename: "gng.bin"
    vlut_filename: "vlut.bin"
    
    gng_params:
      lambda: 50
      max_node_num: 1000
      max_iterations: 100000
      refine_iterations: 100000
      coord_edge_iterations: 200000
      learn_rate_s1: 0.08
      learn_rate_s2: 0.008
      max_edge_age: 500
      alpha: 0.5
      beta: 0.0005
      n_best_candidates: 4
      ais_threshold: 1.0
      start_node_num: 2

    # --- Bridge & Viewer Settings ---
    joint_state_topic: "joint_states"
    stream_topic: "/viewer/internal/stream/robot"
    frame_id: "base_link"
    source_frame_id: "base_link"
    publish_hz: 30.0

    # --- Self Recognition Settings ---
    self_recognition:
      target_frame_id: "world"
      marker_frame_id: "world"

    root_link: "base_link"
    target_frame_id: "world"
    marker_frame_id: "world"
    update_hz: 30.0
    input_topic: "/camera/transformed_points"
    output_topic: "/camera/self_filtered_points"
    self_output_topic: "/camera/self_points"
