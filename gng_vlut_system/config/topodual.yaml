offline_urdf_trainer:
  ros__parameters:
    # Experiment Settings
    experiment_id: "topoarm_double_test"
    data_directory: "gng_results"
    gng_model_filename: "gng.bin"
    vlut_filename: "vlut.bin"

    # Robot Settings
    robot_urdf_path: "package://gng_vlut_system/urdf/topoarm_description/urdf/topoarm_dual.urdf.xacro"
    ground_z_threshold: 0.0
    arm_leaf_link_names: "left_link7,right_link7"
    leaf_link_name: "left_link7"
    paired_leaf_link_name: "right_link7"
    gng_dimension: 12

    # Voxel Resolution Settings
    spatial_map_resolution: 0.02
    sensing_resolution: 0.02
    arm_cache_resolution: 0.008

    # Safety Settings
    danger_threshold: 0.025

    # GNG Offline Training Parameters
    gng_params:
      lambda: 50
      max_node_num: 10000
      num_samples: 1000000
      max_iterations: 1000000
      refine_iterations: 100000
      coord_edge_iterations: 200000
      learn_rate_s1: 0.08
      learn_rate_s2: 0.008
      max_edge_age: 500
      alpha: 0.5
      beta: 0.0005
      n_best_candidates: 4
      ais_threshold: 1.0
      start_node_num: 2

robot_viewer_bridge_node:
  ros__parameters:
    robot_name: "topoarm"
    robot_description_file: "package://gng_vlut_system/urdf/topoarm_description/urdf/topoarm_dual.urdf.xacro"
    arm_leaf_link_names: "left_link7,right_link7"
    joint_state_topic: "/joint_states"
    stream_topic: "/viewer/internal/stream/robot"
    frame_id: "world"
    publish_hz: 30.0
