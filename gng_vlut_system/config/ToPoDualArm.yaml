/**:
  ros__parameters:
  
    voxel_idx_shift:
      x_shift: 42
      y_shift: 21
      z_shift: 0
      offset: 1000000

    robot_name: "ToPoDualArm"
    urdf_path: "/ros2_ws/src/dual_arm_urdf/dual_arm_robot.urdf"
    resource_root_dir: "/ros2_ws/src/dual_arm_urdf"
    mesh_root_dir: "/ros2_ws/src/dual_arm_urdf/meshes"
    # Viewer起動直後の初回関節姿勢配信
    enable_joint_state_publisher: true

    # --- GNG & Safety Settings ---
    gng:
      experiment_id: "ToPoDualArm10000" #実験ID(結果の保存先ディレクトリ名)
      data_directory: "/ros2_ws/src/gng_vlut_system/gng_results" #保存先ディレクトリまでのパス
      gng_model_filename: "gng.bin"
      vlut_filename: "vlut.bin"
      profile_names: "left_arm"
      ground_z_threshold: -10.0
      spatial_map_resolution: 0.01
      self_recognition_resolution: 0.01
      arm_cache_resolution: 0.005
      danger_threshold: 0.025
      vlut_resolution: 0.02
      sensing_resolution: 0.01
      vlut_only: false #gngの結果だけ読み込みvlutの構築だけ実行
      use_voxel_collision: true
      # gng_profiles に列挙した profile は、未指定ならすべて使用
      profiles:
        right_arm:
          root: "R_shoulder_mount"
          eef: "R_tcp"
          voxel_exclude:
            - "base_link"
            - "R_link1"
          dof_exclude:
            - "R_gripper_joint"
            - "R_gripper_mimic"
            - "L_gripper_joint"
            - "L_gripper_mimic"
          dof: 7

        left_arm:
          root: "L_shoulder_mount"
          eef: "L_tcp"
          voxel_exclude:
            - "base_link"
            - "L_link1"
          dof_exclude:
            - "waist_joint"
            - "L_gripper_joint"
            - "L_gripper_mimic"
            - "L_gripper_joint"
            - "L_gripper_mimic"
          dof: 7

    # --- Robot Settings ---
    robot:
      eef_link_names: "L_tcp,R_tcp"
      arm_leaf_link_names: "L_tcp,R_tcp"
      voxel_size: 0.01
      inflation: 0.0

    # --- Gripper grasp-volume graph ---
    gripper_volume_graph:
      enabled: true
      definitions_file: "package://grasping_system/config/ToPoDualArm_gripper_volumes.yaml"
      cache_directory: "/ros2_ws/src/gng_vlut_system/gng_results/ToPoDualArm10000/gripper_volume_cache"
      cache_mode: "use"

    # --- 環境点群からVLUTまでの統合起動設定 ---
    environment_voxelization:
      input_topic: "/camera/camera/depth/color/points"
      voxel_topic: "/ToPoDualArm/roi_voxel_ids"
      source_frame_id: ""
      allow_unconnected_source_as_world: true
      base_frame: "base_link"
      reachability_margin_x: 0.2
      reachability_margin_y: 0.2
      reachability_margin_z: 0.2

      # world座標系のbucket索引とViewer用可視化出力
      world_index:
        # world bucket索引の構築
        enable_build: true
        # ROI voxel化でのworld bucket索引利用
        enable_roi_query: true
        frame_id: "world"
        bucket_size: 0.2
        bucket_topic: "/world_index/buckets"
        enable_bucket_publish: true
        # 追加ROI抽出の並列worker数
        parallel_thread_num: 1

      # 環境側膨張またはVLUT距離によるdanger判定方式
      danger_source: "environment_inflation"
      danger_inflation: 0.05
      vlut_danger_dist: 0.025
      publish_hz: 30.0

      # 固定設置時だけ使用するworldからロボットbaseへの外部較正TF
      enable_static_tf: true
      static_tf_parent_frame: "world"
      static_tf_child_frame: "base_footprint"
      static_tf_x: 0.0
      static_tf_y: 0.0
      static_tf_z: 0.0
      static_tf_roll: 0.0
      static_tf_pitch: 0.0
      static_tf_yaw: 0.0

    collision:
      enable_ground_collision: true
      enable_self_collision: true
      apply_environment_ignore_links: true
      apply_self_collision_exclusion_pairs: true
      voxel_ball:
        voxel_size: 0.0025
        voxel_padding: 0.0
        max_spheres: 8
        min_points_per_sphere: 5
        min_gain_ratio: 0.15
        refine_iterations: 2
        containment_margin: 0.5
        verbose: false
      environment_ignore_links:
        - "base_footprint"
      #(隣接リンク同士は自動で衝突判定をしないように設定)
      self_collision_exclusion_pairs:
        - "L_finger_left|L_finger_right"
        - "R_finger_left|R_finger_right"
    
    gng_params:
      lambda: 200
      max_node_num: 1000
      max_iterations: 1000000
      refine_iterations: 100000
      coord_edge_iterations: 100000
      learn_rate_s1: 0.08
      learn_rate_s2: 0.008
      max_edge_age: 2000
      alpha: 0.5
      beta: 0.0005
      n_best_candidates: 4
      ais_threshold: 10.0
      start_node_num: 2

      #tcpの位置のサンプリング範囲と最大試行回数
      min_x: -0.1
      max_x: 0.5
      min_y: -1.0
      max_y: 1.0
      min_z: -1.0
      max_z: 1.0
      max_attempts: 256

    # --- Bridge & Viewer Settings ---
    joint_state_topic: "joint_states"
    stream_topic: "/viewer/internal/stream/robot"
    frame_id: "base_link"
    source_frame_id: "base_link"
    publish_hz: 30.0
    visualization_gng:
      enabled: true
      path_prefix: ""
      topic_prefix: "topological_map_vis"
      trajectory_input_topic: "plan_topological_map"
      trajectory_topic_prefix: "plan_topological_map_vis"
      candidate_trajectory_input_topic: "cand_topological_map"
      candidate_trajectory_topic_prefix: "cand_topological_map_vis"

    # --- Self Recognition Settings ---
    self_recognition:
      resolution: 0.02
      inflation: 0.0
      update_hz: 30.0
      enable_self_recognition_viz: true
      # 環境ボクセルから自己ボクセルと膨張領域を除外するフィルタ
      enable_environment_self_filter: true
      raw_environment_voxel_topic: "roi_voxel_ids_raw"
      filtered_environment_voxel_topic: "roi_voxel_ids"
      # 自己認識境界の位置ずれ吸収用膨張幅
      self_exclusion_inflation: 0.02
      # 停止済み自己認識結果の継続利用防止用受信間隔
      max_self_mask_age_sec: 0.5
      voxel_size_match_th: 1.0e-9
      root_link: "base_link"
      target_frame_id: "base_link"
      marker_frame_id: "base_link"
      input_topic: "/camera/transformed_points"
      output_topic: "/camera/self_filtered_points"
      self_output_topic: "/camera/self_points"
      mask_topic: "self_voxel"

/left_grasp_voxel_matcher:
  ros__parameters:
    object_voxels_topic: "/topo_voxel_ids"
    environment_voxels_topic: ""
    required_graph_topic: "/ToPoDualArm/L_grip_V_topological_map"
    undersize_graph_topic: "/ToPoDualArm/L_grip_minV_topological_map"
    forbidden_graph_topic: "/ToPoDualArm/L_grip_sweptV_topological_map"
    candidate_topic: "/grasp_pose_cands"
    candidate_voxels_topic: "/grasp_pose_cand_cells"
    summary_topic: "/grasp_pose_cands/summary"
    enable_depth_visibility: false
    minimum_required_occupancy_ratio: 0.1
    minimum_required_hits: 3
    minimum_outside_undersize_hits: 1
    maximum_forbidden_hits: 0
    maximum_anchor_voxels: 500
    maximum_candidates: 50
    yaw_samples: 12
    roll: 0.0
    pitch: 0.0
    yaw_offset: 0.0
    update_period_ms: 500

/top_grasp_surface_estimator:
  ros__parameters:
    topological_map_topic: "/topological_map"
    planar_clusters_topic: "/topological_planar_clusters_incremental"
    candidate_topic: "/top_grasp_pose_cands"
    score_topic: "/top_grasp_pose_cand_scores"
    summary_topic: "/top_grasp_pose_cands/summary"
    # 各平面クラスタをXY投影OBBと隣接平面からの突出距離で判定する。
    up_axis: [0.0, 0.0, 1.0]
    minimum_protrusion_distance: 0.01
    minimum_region_nodes: 4
    # ToPoDualArmの開口内部寸法。余白とGNG点間の補正を両側へ適用する。
    grasp_size_x: 0.15
    grasp_size_y: 0.15
    footprint_margin: 0.002
    footprint_padding: 0.003
    tcp_standoff: 0.0
    maximum_candidates: 20

/grasp_pose_marker_bridge_node:
  ros__parameters:
    input_topic: "/grasp_pose_cands"
    output_topic: "/grasp_pose_markers"
