# 仮想カメラの仮設定。実機RealSenseの機種別校正値ではない
head_depth_camera:
  width: 320
  height: 240
  # 水平画角 [rad]、シミュレーション時間基準の取得頻度 [Hz]
  horizontal_fov: 1.5184364492350666
  update_hz: 10.0
  # 有効深度 [m]
  min_range: 0.1
  max_range: 3.0
  # camera_link基準の光学中心補正 [m]、センサー姿勢補正 [rad]
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
