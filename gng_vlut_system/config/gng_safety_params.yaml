/**:
  ros__parameters:
    # System-wide Voxel Indexing (Common for all nodes)
    voxel_indexing:
      x_shift: 42
      y_shift: 21
      z_shift: 0
      offset: 1000000

    # Global Robot Settings
    robot_urdf_path: "package://gng_vlut_system/urdf/topoarm_description/urdf/topoarm_dual.urdf.xacro"
    voxel_size: 0.01

gng_safety:
  ros__parameters:
    # Experiment Settings
    experiment_id: "topoarm_full_v4"
    data_directory: "gng_results"
    gng_model_filename: "gng.bin"
    vlut_filename: "vlut.bin"

    # GNG Specifics
    ground_z_threshold: 0.0
    gng_dimension: 6
    spatial_map_resolution: 0.02
    self_recognition_resolution: 0.01
    arm_cache_resolution: 0.008
    danger_threshold: 0.025

    # GNG Offline Training Parameters
    gng_params:
      lambda: 50
      max_node_num: 10000
      num_samples: 1000000
      max_iterations: 1000000
      refine_iterations: 100000
      coord_edge_iterations: 200000
      learn_rate_s1: 0.08
      learn_rate_s2: 0.008
      max_edge_age: 500
      alpha: 0.5
      beta: 0.0005
      n_best_candidates: 4
      ais_threshold: 1.0
      start_node_num: 2

robot_viewer_bridge_node:
  ros__parameters:
    robot_name: "topoarm"
    robot_description_file: "package://gng_vlut_system/urdf/topoarm_description/urdf/topoarm.urdf.xacro"
    joint_state_topic: "/joint_states"
    stream_topic: "/viewer/internal/stream/robot"
    frame_id: "world"
    publish_hz: 30.0

self_recognition_filter_node:
  ros__parameters:
    input_topic: "/camera/transformed_points"
    output_topic: "/camera/self_filtered_points"

self_recognition_viz_node:
  ros__parameters:
    marker_frame_id: "base_footprint"
    update_hz: 10.0
