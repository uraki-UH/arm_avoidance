depth_world_index_benchmark:
  ros__parameters:
    # 入力depth画像と内部パラメータ
    depth_topic: "/camera/camera/depth/image_rect_raw"
    camera_info_topic: "/camera/camera/depth/camera_info"

    # 計測条件
    frame_num: 0
    voxel_size: 0.02
    bucket_size: 0.2
    depth_scale: 0.001
    depth_update_mm_th: 1
    free_confirmation_num: 1
    max_dense_voxel_num: 8000000
    robot_num: 1
    enable_comparison_benchmark: false
    enable_runtime_log: false

    # VLUT ID符号化パラメータ
    x_shift: 42
    y_shift: 21
    z_shift: 0
    offset: 1000000

    # 共有index効果の分離用robot配置
    robot_spacing_x: 0.0
    robot_yaw_step_deg: 0.0

    # 局所reachability ROIと安全margin
    min_reachability_x: -0.15
    max_reachability_x: 0.15
    min_reachability_y: -0.15
    max_reachability_y: 0.15
    min_reachability_z: 0.8
    max_reachability_z: 1.2
    reachability_margin_x: 0.05
    reachability_margin_y: 0.05
    reachability_margin_z: 0.05

    # 固定cameraのworld座標系外部パラメータ
    camera_world_x: 0.0
    camera_world_y: 0.0
    camera_world_z: 0.0
    camera_world_roll_deg: 0.0
    camera_world_pitch_deg: 0.0
    camera_world_yaw_deg: 0.0

    # 視覚検証用debug出力
    enable_debug_publish: true
    debug_roi_voxel_topic: "/depth_world_index/debug/roi_voxels"
    debug_world_bucket_voxel_topic: "/depth_world_index/debug/world_buckets_voxels"
    debug_frame_id: ""
