# 環境とは独立した低速の関節タスク例。max_longの空環境向け。
version: 1
defaults:
  move: joint_move
  hold: position
# 動作ごとの部品構成。追加方式も実行器の分岐なし。
methods:
  move:
    joint_move:
      targets: direct
      route: straight
      trajectory: quintic
    joint_path:
      targets: waypoints
      route: straight
      trajectory: quintic
    # 追加依存は下記方式の実行時だけ。未選択時のプラグイン読込なし。
    bit_star: &optional_move
      targets: direct
      route: bit_star
      route_options:
        service_namespace: /sim_topo_dual_arm_max_long
        group_name: dual_arm
        max_plan_sec: 5.0
        max_wait_sec: 5.0
        num_attempts: 1
      trajectory: quintic
    rrt: {<<: *optional_move, route: rrt}
    rrt_connect: {<<: *optional_move, route: rrt_connect}
    rrt_star: {<<: *optional_move, route: rrt_star}
    informed_rrt_star: {<<: *optional_move, route: informed_rrt_star}
    chomp: {<<: *optional_move, route: chomp}
    stomp: {<<: *optional_move, route: stomp}
limits:
  max_velocity: 0.2
  max_acceleration: 0.5
  max_feedback_age_sec: 0.5
  max_task_sec: 60.0
  max_stopping_sec: 5.0
  # 重力補償なしのeffort制御に合わせた全関節の到達誤差 [rad]
  max_position_error_th: 0.05
  max_stopped_velocity_th: 0.03
  settle_sec: 0.25
poses:
  work: {L_joint4: 0.35, R_joint4: 0.35}
  via: {L_joint4: 0.15, R_joint4: 0.15}
  home: {L_joint4: 0.0, R_joint4: 0.0}
paths:
  return_home: [via, home]
tasks:
  - kind: move
    target: work
  - kind: hold
    duration_sec: 1.0
  - kind: move
    method: joint_path
    path: return_home
