/**:
  ros__parameters:

    voxel_idx_shift:
      x_shift: 42
      y_shift: 21
      z_shift: 0
      offset: 1000000

    robot_name: "topo_dual_arm_max_long"
    # 基台座標[m]の固定禁止領域。机の範囲だけの箱指定による後方床下の利用。
    workspace_mask:
      enable_mask: false
      frame_id: "base_link"
      enable_min_z: false
      min_z: 0.0
      # 実測速度による減速余地の予測時間 [sec]。実機の制動性能は未検証。
      braking_prediction_sec: 0.2
      # 各箱[min_x,min_y,min_z,max_x,max_y,max_z]の一次元配列。寸法未設定。
      # 仮寸法の机の設定例。実寸への置換が必要。
      # forbidden_boxes: [-0.10, -0.60, -0.80, 1.20, 0.60, 0.0]
    urdf_path: "/ros2_ws/src/urdf/topo_dual_arm_max_long/topo_dual_arm_max.urdf"
    resource_root_dir: "/ros2_ws/src/urdf/topo_dual_arm_max_long"
    mesh_root_dir: "/ros2_ws/src/urdf/topo_dual_arm_max_long/meshes"    # 実機フォロワー表示用の肩原点・左右グリッパー換算
    dynamixel_mapping_file: "package://dynamixel_joint_state_bridge/config/dynamixel_joint_state_bridge_max_ids_31_52.yaml"
    # Viewer起動直後の初回関節姿勢配信
    enable_joint_state_publisher: true
    # 表示・シミュレーション・実機追従で共用する関節実測配信
    enable_dynamixel_joint_state_input: true
    dynamixel_joint_state_input_config: "package://gng_vlut_system/config/dynamixel_joint_state_input.yaml"

    # センシング・回避計算・実行先を分離した共通ROS回避
    avoidance:
      state_topic: "/sim/joint_states"
      goal_topic: "/avoidance/goal"
      command_topic: "/avoidance/joint_command"
      publish_hz: 50.0
      max_state_age_sec: 0.5
      # 制御対象の固定基台配置 [m, deg]。観測側のbag基台TFとは独立
      base_pos: [0.0, 0.0, 0.0]
      base_rot_deg: [0.0, 0.0, 0.0]
      settings:
        input_kind: "pointcloud"
        gng_strategy: "graph"
        enable_roi_visibility: true

    # GNG学習とVLUT生成
    gng:
      enable_independent_arms: true # 左右別7関節モデルの学習・読込み
      # 配置確定後の一括検査と、関節空間の近傍・全域森による接続
      enable_batched_collision_filter: true
      collision_worker_num: 16
      num_local_neighbors: 6 # 各ノードの距離順近傍候補数。全域森による接続は別枠。
      experiment_id: "topo_dual_arm_max_long_independent" # 学習結果の保存先ディレクトリ名
      data_directory: "/ros2_ws/src/gng_vlut_system/gng_results" #保存先ディレクトリまでのパス
      gng_model_filename: "gng.bin"
      vlut_filename: "vlut.bin"
      profile_names: "left_arm,right_arm"
      ground_z_threshold: -10.0
      spatial_map_resolution: 0.01
      arm_cache_resolution: 0.005
      vlut_resolution: 0.02
      vlut_only: false # 保存済みGNGからのVLUT単独構築
      use_voxel_collision: true
      # 左右各7自由度の学習プロファイル
      profiles:
        right_arm:
          root: "R_shoulder_mount"
          eef: "R_tcp"
          voxel_exclude:
            - "base_link"
            - "R_link1"
          dof_exclude:
            - "R_gripper_joint"
            - "R_gripper_mimic"
            - "L_gripper_joint"
            - "L_gripper_mimic"
          dof: 7

        left_arm:
          root: "L_shoulder_mount"
          eef: "L_tcp"
          voxel_exclude:
            - "base_link"
            - "L_link1"
          dof_exclude:
            - "waist_joint"
            - "L_gripper_joint"
            - "L_gripper_mimic"
            - "R_gripper_joint"
            - "R_gripper_mimic"
          dof: 7

    # シミュレーション点群の基準座標系。入力点群をworld座標で発行する場合はTF変換なし
    input:
      base_frame_id: "world"
      local_coordinates: false

    # ロボット形状
    robot:
      eef_link_names: "L_tcp,R_tcp"
      arm_leaf_link_names: "L_tcp,R_tcp"
      voxel_size: 0.01
      inflation: 0.0

    # 回転式グリッパーの専用把持体積は未定義
    gripper_volume_graph:
      enabled: false

    # 取付補正の共通保存先。校正管理ノードによる更新
    sensor_calibration_file: "package://gng_vlut_system/config/sensor_calibration.yaml"
    # 実機MID-360の入力選択。trueで環境ボクセル化も有効。ドライバは専用Dockerで起動
    mid360:
      enable_input: true
      points_topic: "/livox/lidar"
      # 取付TFの配信元は共通校正管理ノード。専用ドライバ側のenable_mount_tfはfalse
      enable_mount_tf: true
      parent_frame_id: "chest_lidar_link"
      frame_id: "mid360_link"
      # 取付リンクから計測原点への補正[m]。原点差分は未校正
      pos: [0.0, 0.0, 0.0]
      # 計測軸へのRPY[deg]。計測+X=取付+Y、計測+Y=取付-X。45度はURDF側
      rot_deg: [0.0, 0.0, 90.0]

    # --- 環境点群からVLUTまでの統合起動設定 ---
    environment_voxelization:
      input_topic: "/camera/camera/depth/color/points"
      # 自己ロボット領域除去後の環境ボクセル（VLUT入力への接続先）
      voxel_topic: "/topo_dual_arm_max_long/self_filter_roi_voxels"
      source_frame_id: ""
      # 未接続センサ座標系のworld扱い防止
      allow_unconnected_source_as_world: false
      base_frame: "base_link"
      # 左右別GNG用の固定ROI。Viewer統合起動では左右VLUTの占有範囲を使用
      reachability_map_topic: ""
      # BBoxの各面から外側への余白 [m]
      reachability_margin_x: 0.1
      reachability_margin_y: 0.1
      reachability_margin_z: 0.1

      # world座標系のbucket索引とViewer用可視化出力
      world_index:
        # world bucket索引の構築
        enable_build: true
        # ROI voxel化でのworld bucket索引利用
        enable_roi_query: true
        frame_id: "world"
        bucket_size: 0.2
        bucket_topic: "/world_index/buckets"
        enable_bucket_publish: true
        # 追加ROI抽出の並列worker数
        parallel_thread_num: 1

      # 環境側膨張またはVLUT距離によるdanger判定方式
      danger_source: "environment_inflation"
      danger_inflation: 0.05
      vlut_danger_dist: 0.025
      publish_hz: 30.0

      # 固定基台のworld接続。外部配置TF使用時は無効化。URDFルートはbase_link。
      enable_static_tf: true
      static_tf_parent_frame: "world"
      static_tf_child_frame: "base_link"
      static_tf_x: 0.0
      static_tf_y: 0.0
      static_tf_z: 0.0
      static_tf_roll: 0.0
      static_tf_pitch: 0.0
      static_tf_yaw: 0.0

    collision:
      enable_ground_collision: true
      enable_self_collision: true
      apply_environment_ignore_links: true
      apply_self_collision_exclusion_pairs: true
      # 全身メッシュの内部充填ボクセル解像度 [m]。プリミティブは元形状での判定。
      voxel_size: 0.001
      # 環境衝突の除外リンク指定なし。ノード既定の空リスト
      #(隣接リンク同士は自動で衝突判定をしないように設定)
      self_collision_exclusion_pairs:
        - "L_finger_left|L_finger_right"
        - "R_finger_left|R_finger_right"

    gng_params:
      lambda: 200
      max_node_num: 10000
      max_iterations: 2400000
      refine_iterations: 100000
      coord_edge_iterations: 100000
      learn_rate_s1: 0.08
      learn_rate_s2: 0.008
      max_edge_age: 2000
      alpha: 0.5
      beta: 0.0005
      # 関節角・TCPの厳密近傍索引
      enable_nearest_index: true
      # 静的な自己干渉検査での、同一姿勢・同一端点の非干渉結果再利用
      enable_static_collision_cache: true
      n_best_candidates: 4
      ais_threshold: 10.0
      start_node_num: 2

      # URDFルート基準のTCPサンプリング範囲 [m] と最大試行回数
      min_x: -1.5
      max_x: 1.5
      min_y: -1.5
      max_y: 1.5
      min_z: -0.5
      max_z: 1.5
      max_attempts: 256

    # 状態配信とViewer表示
    joint_state_topic: "joint_states"
    stream_topic: "/viewer/internal/stream/robot"
    frame_id: "base_link"
    source_frame_id: "base_link"
    publish_hz: 30.0
    visualization_gng:
      enabled: true
      path_prefix: ""
      topic_prefix: "Tmap_vis"
      trajectory_input_topic: "plan_Tmap"
      trajectory_topic_prefix: "plan_Tmap_vis"
      candidate_trajectory_input_topic: "cand_Tmap"
      candidate_trajectory_topic_prefix: "cand_Tmap_vis"

    # 自己認識
    self_recognition:
      resolution: 0.02
      inflation: 0.0
      update_hz: 30.0
      enable_self_recognition_viz: true
      # 環境ボクセルから自己ボクセルと膨張領域を除外するフィルタ
      enable_environment_self_filter: true
      # 自己ロボット領域の除去前と除去後のトピック
      raw_environment_voxel_topic: "roi_voxels"
      filtered_environment_voxel_topic: "self_filter_roi_voxels"
      # 自己認識境界の位置ずれ吸収用膨張幅
      self_exclusion_inflation: 0.02
      # 停止済み自己認識結果の継続利用防止用受信間隔
      max_self_mask_age_sec: 0.5
      voxel_size_match_th: 1.0e-9
      root_link: "base_link"
      target_frame_id: "base_link"
      marker_frame_id: "base_link"
      input_topic: "/camera/transformed_points"
      mask_topic: "self_voxel"
