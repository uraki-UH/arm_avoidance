dual_arm_avoidance_demo:
  enable_auto_start: true
  # 人の前腕を模したカプセルの接近側
  sides: [left, right]
  hand_far_x: 0.45
  hand_near_x: 0.03
  hand_y: 0.36
  hand_z: 0.38
  arm_length: 0.35
  arm_radius: 0.045
  approach_sec: 24.0
  hold_sec: 3.0
  withdraw_sec: 12.0
  settle_sec: 12.0
  # 外接形状間の目標余裕とデモ停止判定距離 [m]
  target_clearance: 0.12
  min_clearance_th: 0.035
  max_state_age_sec: 1.0
  # 補間指令の関節速度制限 [rad/s]
  max_joint_velocity: 0.45
  control_period_sec: 0.15
