pointcloud_human_candidate_detector_node:
  ros__parameters:
    input_topic: /lidar_points
    detections_3d_topic: /perception/human_candidate/detections_3d
    candidate_points_topic: /perception/human_candidate/points
    human_candidate_detected_topic: /perception/human_candidate/is_detected
    inference_healthy_topic: /perception/human_candidate/is_inference_healthy
    voxel_size_m: 0.08
    min_range_m: 0.3
    max_range_m: 20.0
    min_ground_clearance_m: 0.08
    max_ground_height_m: 2.8
    cluster_tolerance_m: 0.25
    min_cluster_points: 20
    max_cluster_points: 20000
    min_human_height_m: 0.8
    max_human_height_m: 2.5
    min_human_width_m: 0.15
    max_human_width_m: 1.4
    max_human_depth_m: 1.2
    enable_fail_safe: true
    # PointCloud2座標系での床平面係数 ax + by + cz + d = 0
    ground_coefficients: [0.0, 0.0, 1.0, 0.0]
