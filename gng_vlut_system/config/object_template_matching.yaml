object_template_matcher_node:
  ros__parameters:
    shape_tolerance: 0.35
    scale_tolerance: 0.30
    contradiction_limit: 0.20
    yaw_step_deg: 5.0
    enable_roll_pitch_search: false
    roll_tolerance_deg: 8.0
    pitch_tolerance_deg: 8.0
    roll_pitch_step_deg: 4.0
    max_orientation_hypothesis_num: 1000
    max_normal_angle_full_deg: 12.0
    max_normal_angle_partial_deg: 35.0
    enable_rho_evaluation: true
    max_rho_dev_full_ratio: 0.15
    max_rho_dev_partial_ratio: 0.45
    enable_scale_evaluation: true
    min_scale_allow_ratio: 0.70
    min_scale_full_match_ratio: 0.95
    max_scale_full_match_ratio: 1.05
    max_scale_allow_ratio: 1.30
    scale_weight: 0.20
    min_scale_edge_num: 3
    max_degree_dev_full: 0.0
    max_degree_dev_partial: 2.0
    normal_weight: 0.55
    rho_weight: 0.20
    degree_weight: 0.25
    edge_weight: 0.35
    min_node_score: 0.55
    enable_contradiction_evaluation: true
    contradiction_weight: 0.40
    max_contradiction_point_ratio: 0.20
    enable_oversized_plane_filter: true
    plane_clusters_topic: /plane_clusters
    max_plane_normal_angle_deg: 35.0
    max_plane_extent_overflow_ratio: 1.30
    max_plane_cluster_frame_lag: 5
    enable_plane_cluster_evaluation: true
    min_plane_extent_allow_ratio: 0.35
    min_plane_extent_full_match_ratio: 0.70
    max_plane_extent_full_match_ratio: 1.10
    plane_weight: 0.65
    plane_support_score_scale: 1.80
    min_plane_support_score: 0.60
    enable_nonplane_component_evaluation: true
    min_nonplane_component_nodes: 2
    nonplane_weight: 0.30
    nonplane_evidence_score_scale: 0.75
    min_nonplane_evidence_score_th: 0.50

object_template_match_validator_node:
  ros__parameters:
    min_visible_ratio: 0.15
    recognition_threshold: 0.55
    confirmation_time_sec: 0.5
    activate_score_th: 0.65
    deactivate_score_th: 0.40
    min_matched_node_ratio: 0.20
    min_matched_edge_ratio: 0.15
    enable_plane_cluster_evidence: true
    min_plane_support_score: 0.60
    max_missing_node_ratio: 0.80
    max_contradiction_point_ratio: 0.20
    enable_nonplane_component_evaluation: true
    min_nonplane_evidence_frame_num: 5
    min_nonplane_evidence_score_th: 0.50
    min_confirmed_frame_num: 5
    min_confirm_duration_sec: 0.5
    max_lost_duration_sec: 1.0
    state_publish_hz: 2.0
