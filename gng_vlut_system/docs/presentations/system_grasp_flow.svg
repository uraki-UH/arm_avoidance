<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="flow_title flow_desc">
<title id="flow_title">把持候補推定を中心とした全体フロー</title>
<desc id="flow_desc">上段に環境認識と上方把持候補生成、下段に環境・ロボット照合と関節姿勢評価。把持面の寸法確認、姿勢生成、付属ノード確認の順序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526979"/></marker></defs>
